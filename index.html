<style>
:root {
  --bg: #162035;
  --surface: #1e2a4a;
  --surface2: #2d3f6b;
  --border: #3d5280;
  --text: #f0f4ff;
  --muted: #94a3b8;
  --blue: #60a5fa;
  --green: #4ade80;
  --red: #f87171;
  --orange: #fb923c;
  --purple: #c084fc;
  --accent: #fbbf24;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, 'Hiragino Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 10px;
}

.logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
.logo-sub { font-size: 11px; color: var(--muted); margin-left: 4px; }

.alert-badge {
  background: var(--red);
  color: #fff;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  display: none;
}

.sync-status {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  display: none;
}

nav {
  display: flex;
  gap: 4px;
  padding: 8px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

nav button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}

nav button.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 700;
}

.view { display: none; padding: 16px; }
.view.active { display: block; }

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.cal-nav-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 16px;
  cursor: pointer;
  touch-action: manipulation;
}

.cal-title { font-size: 18px; font-weight: 700; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 16px;
}

.dow {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 0;
  color: var(--muted);
}

.dow:first-child { color: #ef4444; }
.dow:last-child { color: #4d7fff; }

.cal-cell {
  min-height: 60px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px;
  cursor: pointer;
  touch-action: manipulation;
  position: relative;
  overflow: hidden;
}
.cal-cell:hover { border-color: #60a5fa; }

.cal-cell:active { opacity: 0.7; }
.cal-cell.other-month { opacity: 0.3; }
.cal-cell.today {
  border-color: #facc15;
  border-width: 3px;
  box-shadow: 0 0 8px rgba(250,204,21,0.6);
  overflow: visible;
  position: relative;
}
.cal-cell.today::before {
  content: 'TODAY';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  background: #facc15;
  color: #7a4a00;
  font-size: 8px;
  font-weight: 900;
  border-radius: 4px;
  padding: 1px 5px;
  white-space: nowrap;
  z-index: 10;
}
.cal-cell.today .cal-day {
  color: #facc15;
  font-size: 13px;
  font-weight: 900;
  margin-top: 4px;
}
.cal-cell.selected { border-color: #60a5fa; border-width: 3px; background: rgba(96,165,250,0.15); box-shadow: 0 0 0 2px rgba(96,165,250,0.3); }

.cal-day {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
}

.cal-cell.sun .cal-day { color: #ef4444; }
.cal-cell.sat .cal-day { color: #4d7fff; }

.cal-chip {
  font-size: 9px;
  border-radius: 3px;
  padding: 1px 3px;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #fff;
}

.cal-more {
  font-size: 9px;
  color: var(--muted);
  margin-top: 1px;
}

.day-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.day-detail-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}

.count-chip {
  display: inline-block;
  border-radius: 20px;
  padding: 2px 12px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}

.card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.customer-name { font-size: 16px; font-weight: 700; }
.phone { font-size: 12px; color: var(--muted); margin-top: 2px; }
.repair-content { font-size: 13px; color: var(--muted); margin: 6px 0; line-height: 1.4; }

.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag {
  font-size: 11px;
  border-radius: 6px;
  padding: 2px 8px;
  font-weight: 600;
  color: #fff;
}

.status-btn {
  display: inline-block;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  min-width: 80px;
  text-align: center;
}

.status-done {
  background: var(--green);
  cursor: default;
}

.search-box {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  margin-bottom: 12px;
}

.filter-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
}

.filter-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}

.filter-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 700;
}

.list-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.list-date {
  font-size: 12px;
  color: var(--muted);
  min-width: 40px;
  text-align: center;
}

.list-info { flex: 1; min-width: 0; }
.list-name { font-size: 15px; font-weight: 700; }
.list-repair { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.list-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.edit-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

.del-btn {
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

.form-section {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.form-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; margin-top: 12px; }
label:first-of-type { margin-top: 0; }

.inp {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 15px;
  font-family: inherit;
}

.inp:focus { outline: none; border-color: var(--blue); }

textarea.inp { min-height: 80px; resize: vertical; }

select.inp { appearance: none; cursor: pointer; }

.btn-primary {
  width: 100%;
  background: var(--blue);
  border: none;
  color: #fff;
  border-radius: 10px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-top: 16px;
  touch-action: manipulation;
}

.btn-cancel {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;
  margin-top: 8px;
  touch-action: manipulation;
}

.ocr-btn {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--blue);
  color: var(--blue);
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 16px;
  touch-action: manipulation;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 500px;
}

.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

.upload-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
}

.upload-icon { font-size: 40px; margin-bottom: 8px; }
.upload-text { color: var(--muted); font-size: 14px; }

.ocr-loading { display: none; text-align: center; padding: 20px; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.vendor-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
}

.vendor-name { font-size: 15px; font-weight: 600; }

.setting-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #333;
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  z-index: 999;
  transition: transform 0.3s;
  white-space: nowrap;
}

#toast.show { transform: translateX(-50%) translateY(0); }
#toast.ok { background: #22c55e; }
#toast.warn { background: #f97316; }
#toast.err { background: #ef4444; }

.empty { color: var(--muted); text-align: center; padding: 28px 0; }
.done-label { font-size: 12px; color: var(--green); margin: 12px 0 8px; font-weight: 700; }

.required::after { content: ' *'; color: var(--red); }

/* カード編集ポップアップ */
.edit-popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.edit-popup-overlay.active { display: flex; }
.edit-popup {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  width: 100%;
  max-width: 600px;
  border-top: 3px solid var(--blue);
  max-height: 85vh;
  overflow-y: auto;
}
.edit-popup-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.edit-popup-close {
  background: var(--surface2);
  border: none;
  color: var(--muted);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 直近アラートパネル */
.urgent-panel {
  margin-bottom: 14px;
}
.urgent-panel-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.signal-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.signal-card {
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  transition: opacity 0.15s;
}
.signal-card:active { opacity: 0.7; }
.signal-card.s-red { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.5); }
.signal-card.s-orange { background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.5); }
.signal-card.s-yellow { background: rgba(234,168,56,0.15); border: 1px solid rgba(234,168,56,0.5); }
.signal-msg {
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 4px;
  line-height: 1.3;
}
.signal-card.s-red .signal-msg { color: #ef4444; }
.signal-card.s-orange .signal-msg { color: #f97316; }
.signal-card.s-yellow .signal-msg { color: #e8a838; }
.signal-count {
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.signal-card.s-red .signal-count { color: #ef4444; }
.signal-card.s-orange .signal-count { color: #f97316; }
.signal-card.s-yellow .signal-count { color: #e8a838; }
.signal-unit {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
}
.signal-date {
  font-size: 10px;
  font-weight: 700;
  border-radius: 4px;
  padding: 2px 4px;
  display: inline-block;
}
.signal-card.s-red .signal-date { background: rgba(239,68,68,0.25); color: #ef4444; }
.signal-card.s-orange .signal-date { background: rgba(249,115,22,0.25); color: #f97316; }
.signal-card.s-yellow .signal-date { background: rgba(234,168,56,0.25); color: #a07020; }
.signal-empty {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 6px 0;
  opacity: 0.5;
}
.urgent-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 8px 0; }

/* 一覧の色分け */
.list-item.today-item { border-left: 3px solid var(--red); }
.list-item.tomorrow-item { border-left: 3px solid var(--orange); }
.list-item.soon-item { border-left: 3px solid var(--accent); }
.pickup-badge {
  font-size: 10px;
  font-weight: 700;
  border-radius: 4px;
  padding: 1px 5px;
  margin-top: 3px;
  display: inline-block;
}
.pickup-badge.today { background: var(--red); color: #fff; }
.pickup-badge.tomorrow { background: var(--orange); color: #fff; }
.pickup-badge.soon { background: var(--accent); color: #000; }

/* 納品時間バッジ */
.time-badge {
  display: inline-block;
  background: #fbbf24;
  color: #7a4a00;
  font-size: 12px;
  font-weight: 900;
  border-radius: 6px;
  padding: 2px 10px;
  white-space: nowrap;
}
.time-badge-sm {
  display: inline-block;
  background: #fbbf24;
  color: #7a4a00;
  font-size: 10px;
  font-weight: 900;
  border-radius: 4px;
  padding: 1px 6px;
  white-space: nowrap;
  margin-top: 2px;
}

/* 作業開始アラートパネル */
.work-alert-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}
.work-alert-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.work-alert-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 5px;
}
.work-alert-row:last-child { margin-bottom: 0; }
.work-alert-row.wa-today { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.4); }
.work-alert-row.wa-tomorrow { background: rgba(251,146,60,0.15); border: 1px solid rgba(251,146,60,0.4); }
.work-alert-row.wa-soon { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.4); }
.wa-badge {
  font-size: 9px;
  font-weight: 700;
  border-radius: 5px;
  padding: 2px 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.wa-badge.wa-today { background: var(--red); color: #fff; }
.wa-badge.wa-tomorrow { background: var(--orange); color: #fff; }
.wa-badge.wa-soon { background: var(--accent); color: #7a4a00; }
.wa-info { flex: 1; min-width: 0; }
.wa-name { font-size: 13px; font-weight: 700; color: var(--text); }
.wa-repair { font-size: 10px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wa-deadline { font-size: 10px; font-weight: 700; color: var(--blue); white-space: nowrap; }

/* ヘッダー検索バー */
.header-search-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
}
.header-search-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 20px;
  padding: 8px 16px 8px 36px;
  font-size: 14px;
  font-family: inherit;
  position: relative;
}
.header-search-input:focus { outline: none; border-color: var(--blue); }
.header-search-wrap {
  position: relative;
}
.header-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  pointer-events: none;
}
.header-search-clear {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  cursor: pointer;
  color: var(--muted);
  display: none;
  background: none;
  border: none;
  padding: 0;
}

/* 検索結果オーバーレイ */
.search-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg);
  z-index: 98;
  overflow-y: auto;
  padding: 12px;
}
.search-overlay.active { display: block; }
.search-result-count {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
  padding: 0 2px;
}
</style>
</head>
<body>

<div class="header">
  <span class="logo">✂ MOMOSE</span>
  <span class="logo-sub">修理管理</span>
  <div class="alert-badge" id="alertBadge">⚠ 要確認 <span id="alertCount">0</span>件</div>
  <span class="sync-status" id="syncStatus">● リアルタイム同期中</span>

<!-- トースト -->
<div id="toast"></div>

<script>
let orders = [];
let vendors = [
  {id:'shop', name:'店舗内作業', isShop:true}
];
let currentView = 'dashboard';
let listFilter = 'all';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedDate = new Date().toISOString().slice(0,10);
let editId = null;
let unsubOrders = null;

const STATUS_LIST_SHOP = ['受付中','作業中','完成'];
const STATUS_LIST_EXT = ['受付中','委託中','店舗に戻った','完成'];
const STATUS_COLOR = {
  '受付中': '#5a5a7a',
  '作業中': '#e67e22',
  '委託中': '#2980b9',
  '店舗に戻った': '#8e44ad',
  '完成': '#27ae60'
};

function getStatuses(vendorId) {
  return vendorId === 'shop' ? STATUS_LIST_SHOP : STATUS_LIST_EXT;
}

function isDone(o) { return o.status === '完成'; }
function todayStr() { return new Date().toISOString().slice(0,10); }
function newId() { return 'o' + Date.now() + Math.floor(Math.random()*1000); }

// ══════════════════════════════
// Firebase操作
// ══════════════════════════════
async function fbSaveOrder(order) {
  if (!window.db) return;
  try {
    await window.fsSetDoc(window.fsDoc(window.db, 'orders', order.id), order);
  } catch(e) {
    showToast('⚠ 保存エラー: ' + e.message, 'err');
  }
}

async function fbDeleteOrder(id) {
  if (!window.db) return;
  try {
    await window.fsDeleteDoc(window.fsDoc(window.db, 'orders', id));
  } catch(e) {
    showToast('⚠ 削除エラー: ' + e.message, 'err');
  }
}

async function fbSaveVendors() {
  if (!window.db) return;
  try {
    await window.fsSetDoc(window.fsDoc(window.db, 'config', 'vendors'), { list: vendors });
  } catch(e) {
    console.warn('委託先保存エラー:', e);
  }
}

async function loadVendors() {
  if (!window.db) return;
  try {
    const snap = await window.fsGetDocs(window.fsCollection(window.db, 'config'));
    snap.forEach(d => {
      if (d.id === 'vendors' && d.data().list) {
        vendors = d.data().list;
        renderVendors();
        renderVendorSelect();
      }
    });
  } catch(e) { console.warn('委託先読み込みエラー:', e); }
}

function startRealtimeSync() {
  if (!window.db) return;
  if (unsubOrders) unsubOrders();

  const q = window.fsQuery(window.fsCollection(window.db, 'orders'));
  unsubOrders = window.fsOnSnapshot(q, (snap) => {
    orders = [];
    snap.forEach(d => orders.push(d.data()));
    orders.sort((a,b) => (a.pickupDate||'').localeCompare(b.pickupDate||''));

    updateAlertBadge();
    if (currentView === 'dashboard') renderDashboard();
    if (currentView === 'list') renderList();

    document.getElementById('syncStatus').style.display = 'block';
  }, (err) => {
    console.warn('同期エラー:', err);
    document.getElementById('fb-status').style.color = 'var(--red)';
    document.getElementById('fb-status').textContent = '● 接続エラー: ' + err.message;
  });
}

window.addEventListener('firebase-ready', async () => {
  await loadVendors();
  startRealtimeSync();
  renderVendorSelect();
  goto('dashboard');
});

// ══════════════════════════════
// ナビゲーション
// ══════════════════════════════
function goto(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  const navBtn = document.getElementById('nav-' + view);
  if (navBtn) navBtn.classList.add('active');

  if (view === 'dashboard') renderDashboard();
  if (view === 'list') renderList();
  if (view === 'vendors') renderVendors();
  if (view === 'register') {
    if (!editId) initForm(null);
    renderVendorSelect();
  }
  if (view === 'settings') initSettings();
}

// ══════════════════════════════
// アラートバッジ
// ══════════════════════════════
function updateAlertBadge() {
  const today = todayStr();
  const overdue = orders.filter(o => !isDone(o) && o.pickupDate && o.pickupDate < today);
  const badge = document.getElementById('alertBadge');
  if (overdue.length > 0) {
    badge.style.display = 'block';
    document.getElementById('alertCount').textContent = overdue.length;
  } else {
    badge.style.display = 'none';
  }
}

// ══════════════════════════════
// カレンダー
// ══════════════════════════════
// ══════════════════════════════
// カード編集ポップアップ
// ══════════════════════════════
function openEditPopup(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;

  document.getElementById('ep-id').value = id;
  document.getElementById('ep-accept-date').value = o.acceptDate || todayStr();
  document.getElementById('ep-date').value = o.pickupDate || '';
  document.getElementById('ep-time').value = o.pickupTime || '';
  document.getElementById('ep-name').value = o.customerName || '';
  document.getElementById('ep-phone').value = o.phone || '';
  document.getElementById('ep-repair').value = o.repairContent || '';
  document.getElementById('ep-start-date').value = o.startDate || '';

  // 委託先セレクト
  const sel = document.getElementById('ep-vendor');
  sel.innerHTML = vendors.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
  sel.value = o.vendorId || 'shop';

  document.getElementById('editPopupOverlay').classList.add('active');
}

function closeEditPopup() {
  document.getElementById('editPopupOverlay').classList.remove('active');
}

function saveEditPopup() {
  const id = document.getElementById('ep-id').value;
  const acceptDate = document.getElementById('ep-accept-date').value;
  const pickupDate = document.getElementById('ep-date').value;
  const pickupTime = document.getElementById('ep-time').value;
  const customerName = document.getElementById('ep-name').value.trim();
  const phone = document.getElementById('ep-phone').value.trim();
  const repairContent = document.getElementById('ep-repair').value.trim();
  const startDate = document.getElementById('ep-start-date').value;
  const vendorId = document.getElementById('ep-vendor').value;

  if (!acceptDate) { showToast('⚠ 受付日を入力してください', 'warn'); return; }
  if (!pickupDate) { showToast('⚠ 受取予定日を入力してください', 'warn'); return; }
  if (!customerName) { showToast('⚠ お客様名を入力してください', 'warn'); return; }
  if (!repairContent) { showToast('⚠ 修理内容を入力してください', 'warn'); return; }

  const existing = orders.find(o => o.id === id);
  if (!existing) return;

  const updated = {
    ...existing,
    acceptDate,
    pickupDate,
    customerName,
    phone,
    repairContent,
    pickupTime,
    startDate,
    vendorId,
    updatedAt: new Date().toISOString()
  };

  fbSaveOrder(updated);
  closeEditPopup();
  showToast('✅ 更新しました');
}

// ポップアップ外タップで閉じる
document.getElementById('editPopupOverlay')?.addEventListener('click', function(e) {
  if (e.target === this) closeEditPopup();
});

// ══════════════════════════════
// ヘッダー検索
// ══════════════════════════════
function handleHeaderSearch(val) {
  const clearBtn = document.getElementById('headerSearchClear');
  const overlay = document.getElementById('searchOverlay');

  if (!val.trim()) {
    clearBtn.style.display = 'none';
    overlay.classList.remove('active');
    return;
  }

  clearBtn.style.display = 'block';
  overlay.classList.add('active');
  renderSearchResults(val.trim());
}

function clearHeaderSearch() {
  document.getElementById('headerSearch').value = '';
  document.getElementById('headerSearchClear').style.display = 'none';
  document.getElementById('searchOverlay').classList.remove('active');
}

function renderSearchResults(q) {
  const filtered = orders.filter(o =>
    (o.customerName || '').includes(q)
  ).sort((a,b) => (b.pickupDate||'').localeCompare(a.pickupDate||''));

  const countEl = document.getElementById('searchResultCount');
  const listEl = document.getElementById('searchResultList');

  if (filtered.length === 0) {
    countEl.textContent = '「' + q + '」の検索結果：0件';
    listEl.innerHTML = '<p class="empty">該当するお客様が見つかりません</p>';
    return;
  }

  countEl.textContent = '「' + q + '」の検索結果：' + filtered.length + '件';

  const weekdays = ['日','月','火','水','木','金','土'];
  const html = filtered.map(o => {
    const statuses = getStatuses(o.vendorId);
    const idx = statuses.indexOf(o.status);
    const hasNext = idx >= 0 && idx < statuses.length - 1;
    const mm = (o.pickupDate||'').slice(5,7);
    const dd = (o.pickupDate||'').slice(8,10);
    const dow = o.pickupDate ? weekdays[new Date(o.pickupDate + 'T00:00:00').getDay()] : '';

    const diff = o.pickupDate ? dateDiff(o.pickupDate) : null;
    let itemCls = 'list-item';
    let pickupBadge = '';
    if (!isDone(o) && diff !== null) {
      if (diff === 1) { itemCls += ' today-item'; pickupBadge = '<span class="pickup-badge today">明日</span>'; }
      else if (diff === 2) { itemCls += ' tomorrow-item'; pickupBadge = '<span class="pickup-badge tomorrow">2日後</span>'; }
      else if (diff === 3) { itemCls += ' soon-item'; pickupBadge = `<span class="pickup-badge soon">3日後</span>`; }
    }

    const statusBtn = hasNext
      ? `<div class="status-btn" style="background:${STATUS_COLOR[statuses[idx+1]]||'#444'};font-size:12px;padding:6px 10px" data-id="${o.id}">→ ${statuses[idx+1]}</div>`
      : `<div class="status-btn status-done" style="font-size:12px;padding:6px 10px">✓ 完成</div>`;

    return `<div class="${itemCls}">
      <div class="list-date">
        <div>${mm}/${dd}(${dow})</div>
        ${o.pickupTime ? `<span class="time-badge-sm">${esc(o.pickupTime)}〜</span>` : ''}
        ${pickupBadge}
      </div>
      <div class="list-info">
        <div class="list-name">${esc(o.customerName)}</div>
        <div class="list-repair">${esc(o.repairContent)}</div>
      </div>
      <div class="list-actions">
        ${statusBtn}
        <button class="edit-btn" onclick="clearHeaderSearch();startEdit('${o.id}')">編集</button>
        <button class="del-btn" onclick="deleteOrder('${o.id}')">削除</button>
      </div>
    </div>`;
  }).join('');

  listEl.innerHTML = html;
  bindStatusBtns(listEl);
}

// ══════════════════════════════
// 時間を数値化（ソート用）時間指定なしは最後に回す
// ══════════════════════════════
function timeToNum(t) {
  if (!t) return 99;
  const h = parseInt(t.split(':')[0], 10);
  return isNaN(h) ? 99 : h;
}

// ══════════════════════════════
// 日付の差分（日数）を返す
// ══════════════════════════════
function dateDiff(ds) {
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(ds + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

// 直近アラートパネル描画
function renderWorkAlertPanel() {
  const panel = document.getElementById('workAlertPanel');
  if (!panel) return;

  const weekdays = ['日','月','火','水','木','金','土'];

  function formatDate(ds) {
    if (!ds) return '';
    const d = new Date(ds + 'T00:00:00');
    return `${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
  }

  const workOrders = orders.filter(o => {
    if (isDone(o) || !o.startDate) return false;
    const diff = dateDiff(o.startDate);
    return diff >= 0 && diff <= 3;
  }).sort((a,b) => a.startDate.localeCompare(b.startDate));

  if (workOrders.length === 0) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';

  const rows = workOrders.map(o => {
    const diff = dateDiff(o.startDate);
    let cls, badgeText;
    if (diff === 0) { cls = 'wa-today'; badgeText = '本日開始を'; }
    else if (diff === 1) { cls = 'wa-tomorrow'; badgeText = '明日開始を'; }
    else { cls = 'wa-soon'; badgeText = `${diff}日後に開始を`; }

    const pickupStr = o.pickupDate ? `納品 ${formatDate(o.pickupDate)}` : '';

    return `<div class="work-alert-row ${cls}">
      <span class="wa-badge ${cls}">${badgeText}</span>
      <div class="wa-info">
        <div class="wa-name">${esc(o.customerName)}</div>
        <div class="wa-repair">${esc(o.repairContent)}</div>
      </div>
      <div class="wa-deadline">${pickupStr}</div>
    </div>`;
  }).join('');

  panel.innerHTML = `<div class="work-alert-title">🔧 作業開始アラート</div>${rows}`;
}

function renderUrgentPanel() {
  const panel = document.getElementById('urgentPanel');
  if (!panel) return;

  const weekdays = ['日','月','火','水','木','金','土'];

  function formatPickupDate(ds) {
    if (!ds) return '';
    const d = new Date(ds + 'T00:00:00');
    return `${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）納品`;
  }

  function getFirstDate(ordersArr) {
    if (!ordersArr.length) return '';
    const sorted = [...ordersArr].sort((a,b) => a.pickupDate.localeCompare(b.pickupDate));
    return sorted[0].pickupDate;
  }

  // 3グループに分類
  const redOrders    = orders.filter(o => !isDone(o) && o.pickupDate && dateDiff(o.pickupDate) === 1);
  const orangeOrders = orders.filter(o => !isDone(o) && o.pickupDate && dateDiff(o.pickupDate) === 2);
  const yellowOrders = orders.filter(o => !isDone(o) && o.pickupDate && dateDiff(o.pickupDate) === 3);

  const total = redOrders.length + orangeOrders.length + yellowOrders.length;
  if (total === 0) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';

  function signalCard(cls, msg, ordersArr, firstDate) {
    const count = ordersArr.length;
    const dateStr = firstDate ? formatPickupDate(firstDate) : '';
    if (count === 0) {
      return `<div class="signal-card ${cls}">
        <div class="signal-msg">${msg}</div>
        <div class="signal-count" style="font-size:20px">−</div>
        <div class="signal-unit">件なし</div>
        <div class="signal-date" style="opacity:0.4">−</div>
      </div>`;
    }
    return `<div class="signal-card ${cls}" onclick="selectDate('${firstDate}')">
      <div class="signal-msg">${msg}</div>
      <div class="signal-count">${count}</div>
      <div class="signal-unit">件</div>
      <div class="signal-date">${dateStr}</div>
    </div>`;
  }

  const redDate    = getFirstDate(redOrders);
  const orangeDate = getFirstDate(orangeOrders);
  const yellowDate = getFirstDate(yellowOrders);

  panel.innerHTML = `
    <div class="urgent-panel-title">⚠ 作業着手アラート</div>
    <div class="signal-grid">
      ${signalCard('s-red',    '本日中に完成を', redOrders,    redDate)}
      ${signalCard('s-orange', '今日中に着手を', orangeOrders, orangeDate)}
      ${signalCard('s-yellow', 'そろそろ着手を', yellowOrders, yellowDate)}
    </div>
  `;
}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderDashboard(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderDashboard(); }

function renderDashboard() {
  renderUrgentPanel();
  renderWorkAlertPanel();
  document.getElementById('calTitle').textContent = `${calYear}年${calMonth+1}月`;

  const first = new Date(calYear, calMonth, 1);
  const last = new Date(calYear, calMonth+1, 0);
  const today = todayStr();

  const dows = ['日','月','火','水','木','金','土'];
  let html = dows.map(d => `<div class="dow">${d}</div>`).join('');

  for (let i = 0; i < first.getDay(); i++) {
    const d = new Date(calYear, calMonth, -first.getDay()+i+1);
    html += `<div class="cal-cell other-month"><div class="cal-day">${d.getDate()}</div></div>`;
  }

  for (let d = 1; d <= last.getDate(); d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayOrders = orders.filter(o => o.pickupDate === ds);
    const dow = new Date(calYear, calMonth, d).getDay();
    const isToday = ds === today;
    const isSel = ds === selectedDate;

    let cls = 'cal-cell';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    if (isToday) cls += ' today';
    if (isSel) cls += ' selected';

    let chips = '';
    const sortedDay = [...dayOrders].sort((a,b) => timeToNum(a.pickupTime) - timeToNum(b.pickupTime));
    const pending = sortedDay.filter(o => !isDone(o));
    const done = sortedDay.filter(o => isDone(o));
    const showItems = [...pending, ...done].slice(0, 2);
    showItems.forEach(o => {
      const bg = isDone(o) ? '#27ae60' : '#e74c3c';
      const timeLabel = o.pickupTime ? `🕐${o.pickupTime} ` : '';
      chips += `<div class="cal-chip" style="background:${bg}">${timeLabel}${o.customerName} ${o.repairContent.slice(0,6)}...</div>`;
    });
    if (dayOrders.length > 2) chips += `<div class="cal-more">+${dayOrders.length-2}件</div>`;

    html += `<div class="${cls}" onclick="selectDate('${ds}')">
      <div class="cal-day">${d}</div>
      ${chips}
    </div>`;
  }

  const remaining = 7 - ((first.getDay() + last.getDate()) % 7);
  if (remaining < 7) {
    for (let i = 1; i <= remaining; i++) {
      html += `<div class="cal-cell other-month"><div class="cal-day">${i}</div></div>`;
    }
  }

  document.getElementById('calGrid').innerHTML = html;
  renderDayDetail(selectedDate);
}

function selectDate(ds) {
  selectedDate = ds;
  renderDashboard();
}

function renderDayDetail(ds) {
  const dayOrders = orders.filter(o => o.pickupDate === ds)
    .sort((a,b) => timeToNum(a.pickupTime) - timeToNum(b.pickupTime));
  const today = todayStr();
  const d = new Date(ds + 'T00:00:00');
  const diff = Math.round((d - new Date(today + 'T00:00:00')) / 86400000);
  const label = diff === 0 ? '【今日】' : diff > 0 ? `${diff}日後` : `${Math.abs(diff)}日前`;
  const weekdays = ['日','月','火','水','木','金','土'];
  const dateLabel = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${weekdays[d.getDay()]})`;

  const pending = dayOrders.filter(o => !isDone(o));
  const done = dayOrders.filter(o => isDone(o));
  const chipBg = pending.length > 0 ? '#e74c3c' : '#3a3a4a';

  let cardsHtml = '';
  if (dayOrders.length === 0) {
    cardsHtml = '<p class="empty">この日の受取予定はありません</p>';
  } else {
    if (pending.length > 0) cardsHtml += pending.map(o => cardHTML(o)).join('');
    if (done.length > 0) cardsHtml += `<p class="done-label">✓ 完成済み</p>` + done.map(o => cardHTML(o)).join('');
  }

  document.getElementById('dayDetail').innerHTML = `
    <div class="day-detail">
      <div class="day-detail-title">${dateLabel} <span style="color:var(--muted);font-size:14px">${label}</span></div>
      <span class="count-chip" style="background:${chipBg}">未完成 ${pending.length}件 / 計 ${dayOrders.length}件</span>
      ${cardsHtml}
    </div>`;

  bindStatusBtns(document.getElementById('dayDetail'));
}

function cardHTML(o) {
  const statuses = getStatuses(o.vendorId);
  const idx = statuses.indexOf(o.status);
  const hasNext = idx >= 0 && idx < statuses.length - 1;
  const vendor = vendors.find(v => v.id === o.vendorId);
  const vendorName = vendor ? vendor.name : o.vendorId;

  const statusColor = STATUS_COLOR[o.status] || '#444';
  const statusBtn = hasNext
    ? `<div class="status-btn" style="background:${STATUS_COLOR[statuses[idx+1]]||'#444'}" data-id="${o.id}">→ ${statuses[idx+1]}</div>`
    : `<div class="status-btn status-done">✓ 完成</div>`;

  // ★受付日の表示（データにある場合のみ）
  const acceptDateHtml = o.acceptDate
    ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">受付日: ${o.acceptDate}</div>`
    : '';

  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="customer-name">${esc(o.customerName)} ${o.pickupTime ? `<span class="time-badge">🕐 ${esc(o.pickupTime)}以降</span>` : ''}</div>
        ${o.phone ? `<div class="phone">${esc(o.phone)}</div>` : ''}
        ${acceptDateHtml}
      </div>
      ${statusBtn}
    </div>
    <p class="repair-content">${esc(o.repairContent)}</p>
    <div class="tags">
      <span class="tag" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border)">🏭 ${esc(vendorName)}</span>
      <span class="tag" style="background:${statusColor}">${esc(o.status)}</span>
      <button class="edit-btn" style="margin-left:auto" onclick="openEditPopup('${o.id}')">✏️ 編集</button>
    </div>
  </div>`;
}

function bindStatusBtns(container) {
  if (!container) return;
  container.querySelectorAll('.status-btn[data-id]').forEach(btn => {
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', function() {
      advanceStatus(this.dataset.id);
    });
    newBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      advanceStatus(this.dataset.id);
    }, { passive: false });
  });
}

function advanceStatus(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  const list = getStatuses(o.vendorId);
  const idx = list.indexOf(o.status);
  if (idx < 0 || idx >= list.length - 1) return;
  const newStatus = list[idx + 1];
  const updated = { ...o, status: newStatus, updatedAt: new Date().toISOString() };

  orders = orders.map(x => x.id === id ? updated : x);
  if (currentView === 'dashboard') renderDashboard();
  if (currentView === 'list') renderList();

  fbSaveOrder(updated);
  showToast(`✅ ${o.customerName}さん：${newStatus}`);
}

  listFilter = f;

  btn.classList.add('active');

function renderList() {
  const q = (document.getElementById('searchBox')?.value || '').toLowerCase();
  let filtered = orders.filter(o =>
    (o.customerName||'').toLowerCase().includes(q) ||
    (o.repairContent||'').toLowerCase().includes(q)
  );

  const all = filtered.length;
  const pending = filtered.filter(o => !isDone(o)).length;
  const done = filtered.filter(o => isDone(o)).length;

  document.getElementById('cnt-all').textContent = all;
  document.getElementById('cnt-pending').textContent = pending;
  document.getElementById('cnt-done').textContent = done;

  if (listFilter === 'pending') filtered = filtered.filter(o => !isDone(o));
  if (listFilter === 'done') filtered = filtered.filter(o => isDone(o));

  filtered = [...filtered].sort((a,b) => {
    const dateCmp = (b.pickupDate||'').localeCompare(a.pickupDate||'');
    if (dateCmp !== 0) return dateCmp;
    return timeToNum(a.pickupTime) - timeToNum(b.pickupTime);
  });

  if (filtered.length === 0) {
    document.getElementById('list-items').innerHTML = '<p class="empty">データがありません</p>';
    return;
  }

  const html = filtered.map(o => {
    const statuses = getStatuses(o.vendorId);
    const idx = statuses.indexOf(o.status);
    const hasNext = idx >= 0 && idx < statuses.length - 1;
    const mm = (o.pickupDate||'').slice(5,7);
    const dd = (o.pickupDate||'').slice(8,10);
    // ★受付日も表示
    const acceptMm = (o.acceptDate||'').slice(5,7);
    const acceptDd = (o.acceptDate||'').slice(8,10);
    const acceptLabel = o.acceptDate ? `受付${acceptMm}/${acceptDd}` : '';

    // 色分け
    let itemCls = 'list-item';
    let pickupBadge = '';
    if (!isDone(o) && o.pickupDate) {
      const diff = dateDiff(o.pickupDate);
      if (diff === 0) { itemCls += ' today-item'; pickupBadge = '<span class="pickup-badge today">今日</span>'; }
      else if (diff === 1) { itemCls += ' tomorrow-item'; pickupBadge = '<span class="pickup-badge tomorrow">明日</span>'; }
      else if (diff >= 2 && diff <= 3) { itemCls += ' soon-item'; pickupBadge = `<span class="pickup-badge soon">${diff}日後</span>`; }
    }

    const statusBtn = hasNext
      ? `<div class="status-btn" style="background:${STATUS_COLOR[statuses[idx+1]]||'#444'};font-size:12px;padding:6px 10px" data-id="${o.id}">→ ${statuses[idx+1]}</div>`
      : `<div class="status-btn status-done" style="font-size:12px;padding:6px 10px">✓ 完成</div>`;

    return `<div class="${itemCls}">
      <div class="list-date">
        <div>${mm}/${dd}</div>
        ${o.pickupTime ? `<span class="time-badge-sm">${esc(o.pickupTime)}〜</span>` : ''}
        ${pickupBadge}
        ${acceptLabel ? `<div style="font-size:10px;color:var(--muted)">${acceptLabel}</div>` : ''}
      </div>
      <div class="list-info">
        <div class="list-name">${esc(o.customerName)}</div>
        <div class="list-repair">${esc(o.repairContent)}</div>
      </div>
      <div class="list-actions">
        ${statusBtn}
        <button class="edit-btn" onclick="startEdit('${o.id}')">編集</button>
        <button class="del-btn" onclick="deleteOrder('${o.id}')">削除</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('list-items').innerHTML = html;
  bindStatusBtns(document.getElementById('list-items'));
}

  const customerName = document.getElementById('f-name').value.trim();

  const repairContent = document.getElementById('f-repair').value.trim();
  const startDate = document.getElementById('f-start-date').value;

  if (!pickupDate) { showToast('⚠ 受取予定日を入力してください', 'warn'); return; }
  if (!customerName) { showToast('⚠ お客様名を入力してください', 'warn'); return; }
  if (!repairContent) { showToast('⚠ 修理内容を入力してください', 'warn'); return; }

  const id = editId || newId();

    id,
    acceptDate,
    customerName,
    phone,
    repairContent,
    pickupDate,
    pickupTime,
    startDate,
    vendorId,
    status: existing ? existing.status : '受付中',
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString()

  fbSaveOrder(order);
  showToast(editId ? '✅ 更新しました' : '✅ 受付登録しました');

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQML6zZVJLpncdXJSDDuK73ksYC9rte2ln3_DHOgrXtdE1Zq9RHIQlsFQ4tPN1UPnp/exec';

async function importFromSheet() {
  if (!confirm('スプレッドシートのデータをFirebaseにインポートします。既存のデータは上書きされません。続けますか？')) return;
  showToast('📥 インポート中...', 'warn');
  try {
    const res = await fetch(GAS_URL + '?action=getAll');
    const data = await res.json();
    if (!data.success || !data.data) { showToast('⚠ データ取得失敗', 'err'); return; }

    let count = 0;
    for (const o of data.data) {
      if (!o.id || !o.customerName) continue;

        id: String(o.id),
        acceptDate: o.acceptDate || '',
        customerName: o.customerName || '',
        phone: o.phone || '',
        repairContent: o.repairContent || '',
        pickupDate: pd,
        vendorId: 'shop',
        status: o.status || '受付中',
        createdAt: o.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      await fbSaveOrder(order);

    }
    showToast(`✅ ${count}件インポート完了！`);

function compressImage(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let {width, height} = img;
      const maxDim = 1920;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      let quality = 0.85;
      let result = canvas.toDataURL('image/jpeg', quality);
      while (result.length > 4 * 1024 * 1024 * 1.37 && quality > 0.3) {
        quality -= 0.1;
        result = canvas.toDataURL('image/jpeg', quality);
      }
      resolve(result.split(',')[1]);
    };
    img.src = dataUrl;
  });
}

async function handleOcrImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    document.getElementById('ocr-upload-area').style.display = 'none';
    document.getElementById('ocr-loading').style.display = 'block';

    const CLAUDE_API_KEY = localStorage.getItem('momose_claude_key') || '';
    if (!CLAUDE_API_KEY) {
      closeOcrModal();
      showToast('⚠ 設定でAPIキーを登録してください', 'warn');
      goto('settings');
      return;
    }

    try {
      const base64 = await compressImage(e.target.result);
      const today = new Date();
      const yyyy = today.getFullYear();

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': CLAUDE_API_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 1024,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
              { type: 'text', text: `この洋服お直し店の作業伝票を読み取って、以下の形式でJSONのみを返してください。年は${yyyy}年として解釈してください。{"customerName":"お客様名（様は除く）","phone":"電話番号","repairContent":"修理内容","pickupDate":"受取予定日をYYYY-MM-DD形式で"}` }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.[0]?.text || '';
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      if (parsed.pickupDate) document.getElementById('f-date').value = parsed.pickupDate;
      if (parsed.customerName) document.getElementById('f-name').value = parsed.customerName;
      if (parsed.phone) document.getElementById('f-phone').value = parsed.phone;
      if (parsed.repairContent) document.getElementById('f-repair').value = parsed.repairContent;
      // ★OCR後も受付日は今日のまま（自動設定済み）

      closeOcrModal();
      showToast('✅ 読み取り完了！内容を確認してください');

    } catch(err) {
      document.getElementById('ocr-upload-area').style.display = 'block';
      document.getElementById('ocr-loading').style.display = 'none';
      showToast('⚠ 読み取りエラー: ' + err.message, 'err');
    }
  };
  reader.readAsDataURL(file);
}

// ══════════════════════════════
// ユーティリティ
// ══════════════════════════════
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

let _toastTimer;
function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

window.addEventListener('DOMContentLoaded', () => {});
</script>
</body>
</html>
